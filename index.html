<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المملكة العربية السعودية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .city-marker {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            border: 2px solid #000000;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .important-city-marker {
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 50%;
            border: 2px solid #000000;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .city-label {
            color: #000000;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            margin-top: 5px;
            padding: 2px 4px;
            text-shadow: 
                2px 2px 0 #fff,
                -2px 2px 0 #fff,
                2px -2px 0 #fff,
                -2px -2px 0 #fff,
                2px 0 0 #fff,
                -2px 0 0 #fff,
                0 2px 0 #fff,
                0 -2px 0 #fff;
            cursor: pointer;
        }
        .region-label {
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            padding: 2px 4px;
            text-shadow: 
                2px 2px 0 #fff,
                -2px 2px 0 #fff,
                2px -2px 0 #fff,
                -2px -2px 0 #fff,
                2px 0 0 #fff,
                -2px 0 0 #fff,
                0 2px 0 #fff,
                0 -2px 0 #fff;
        }
        .marker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .marker-container:hover {
            transform: scale(1.1);
            transition: transform 0.2s;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="map.js"></script>
</body>
</html>
