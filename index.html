<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المملكة العربية السعودية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .region-label {
            font-size: 1.5em;
            font-weight: bold;
            color: #000;
            text-align: center;
            white-space: nowrap;
        }

        .city-label, .important-city-label {
            display: inline-block;
            position: relative;
            font-weight: bold;
            text-align: center; 
            color: black; 
            white-space: nowrap;
            font-size: 1.2em;
            cursor: pointer;
            padding-top: 25px;
        }

        /* المدن العادية: النقطة حمراء */
        .city-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background-color: red; 
            border-radius: 50%;
        }

        /* المدن المهمة: النقطة سوداء */
        .important-city-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background-color: black; 
            border-radius: 50%;
        }

        @media (max-width: 600px) {
            .region-label {
                font-size: 1.2em;
            }
            .city-label, .important-city-label {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
