<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المملكة العربية السعودية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .region-label {
            font-size: 1.5em;
            font-weight: bold;
            color: #000;
            text-align: center;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.8);
            padding: 0.3em 0.5em;
            border-radius: 0.5em;
            border: 1px solid #ccc;
        }

        .city-label, .important-city-label {
            display: inline-block;
            position: absolute;
            font-weight: bold;
            text-align: center; 
            color: black; 
            white-space: nowrap;
            border-radius: 0.5em;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.4em 0.6em;
            font-size: 1.2em;
            border: 1px solid #ddd;
        }

        /* المدن العادية: النقطة حمراء */
        .city-label::before {
            content: '';
            display: block;
            width: 1em;
            height: 1em;
            background-color: red; 
            border-radius: 50%;
            margin: 0.3em auto 0.4em auto; 
        }

        /* المدن المهمة: النقطة سوداء */
        .important-city-label::before {
            content: '';
            display: block;
            width: 1em;
            height: 1em;
            background-color: black; 
            border-radius: 50%;
            margin: 0.3em auto 0.4em auto; 
        }

        /* تحسين قابلية القراءة على الشاشات المختلفة */
        @media (max-width: 600px) {
            .region-label {
                font-size: 1.2em;
            }
            .city-label, .important-city-label {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
